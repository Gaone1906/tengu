id: sample-autonomy
title: Sample Autonomy Workflow
description: Generic workflow fixture for migration tests.
version: 1
status: active
trigger:
  kind: manual
orchestrator: ops-lead
steps:
  - id: plan
    title: Plan the work
    role: plan
    employee: ops-lead
    handoffTo:
      - implement
  - id: implement
    title: Implement the change
    role: implement
    engine: claude
    handoffTo:
      - verify
  - id: verify
    title: Verify the result
    role: verify
    engine: codex
    gates:
      - kind: approval
        approvalRef: operator-review
        description: Operator accepts the result.
