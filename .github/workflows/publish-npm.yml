name: Publish to npm

on:
  push:
    tags:
      - "v*"

# A version tag is the irreversible publish trigger. Never add pull_request,
# pull_request_target, or workflow_dispatch without preserving the identity
# checks below and explicitly reviewing the expanded release authority.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

# npm Trusted Publishing exchanges GitHub's short-lived OIDC identity for
# publish authority. No npm token is stored in GitHub.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node and npm registry
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Verify release identity and toolchain
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./packages/jinn/package.json').version")"
          PACKAGE_REPOSITORY="$(node -p "require('./packages/jinn/package.json').repository.url")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Refusing publish: tag '$RELEASE_TAG' does not match package version '$PACKAGE_VERSION'." >&2
            exit 1
          fi

          if [[ "$PACKAGE_REPOSITORY" != "git+https://github.com/hristo2612/jinn.git" ]]; then
            echo "Refusing publish: package repository identity changed to '$PACKAGE_REPOSITORY'." >&2
            exit 1
          fi

          TAGGED_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_COMMIT" != "$TAGGED_COMMIT" ]]; then
            echo "Refusing publish: checkout does not match the tagged commit." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" refs/remotes/origin/main; then
            echo "Refusing publish: tagged commit is not part of origin/main." >&2
            exit 1
          fi

          if ! grep -Fq "## [$PACKAGE_VERSION]" CHANGELOG.md; then
            echo "Refusing publish: CHANGELOG.md has no entry for $PACKAGE_VERSION." >&2
            exit 1
          fi

          NPM_VERSION="$(npm --version)"
          node - "$NPM_VERSION" <<'NODE'
          const actual = process.argv[2].split(".").map(Number)
          const minimum = [11, 5, 1]
          let comparison = 0
          for (let index = 0; index < minimum.length; index += 1) {
            if (actual[index] > minimum[index]) {
              comparison = 1
              break
            }
            if (actual[index] < minimum[index]) {
              comparison = -1
              break
            }
          }
          if (comparison < 0) {
            console.error(`Trusted Publishing requires npm CLI 11.5.1 or newer; runner has ${process.argv[2]}.`)
            process.exit(1)
          }
          NODE

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Verify migration bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^")"
          pnpm --filter jinn-cli migration:check -- --base-ref "$PREVIOUS_TAG" --version "$PACKAGE_VERSION"

      - name: Verify npm package contents
        working-directory: packages/jinn
        run: npm pack --dry-run

      - name: Publish through npm Trusted Publishing
        working-directory: packages/jinn
        run: npm publish
